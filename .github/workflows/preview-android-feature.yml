name: Test PR Comment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Echo test 1
        run: echo "Running mocked test 1"

      - name: Echo test 2
        run: echo "Running mocked test 2"

      - name: Add mock link as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: Number('${{ github.event.inputs.pr_number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔗 [Sample Link for Test Build](https://example.com/mock-build)'
            })